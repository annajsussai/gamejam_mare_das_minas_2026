<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gerenciador do Porto - Inspeção Dinâmica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

    body {
      background-color: #0d1b2a;
      font-family: 'VT323', monospace;
      user-select: none;
      touch-action: manipulation;
    }

    .pixel-font {
      font-family: 'Press Start 2P', monospace;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #78350f;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #d97706;
      border-radius: 3px;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen min-h-[100dvh] text-white p-1 sm:p-3 overflow-hidden">

  <div class="w-full max-w-5xl max-h-[100dvh] bg-slate-900 border-2 sm:border-4 border-amber-600 rounded-lg p-1.5 sm:p-3 shadow-2xl flex flex-col gap-1.5 sm:gap-3 my-auto">
    
    <!-- Top Bar Status -->
    <div class="flex justify-between items-center bg-slate-800 p-1.5 sm:p-3 rounded border border-slate-700 text-xs sm:text-base">
      <div class="flex items-center gap-2 sm:gap-4">
        <span class="pixel-font text-yellow-400 text-[10px] sm:text-sm">DIA <span id="currentDay">1</span> / 3</span>
        <span class="text-sm sm:text-xl text-cyan-300">NAVIO: <span id="shipCount">1</span> / 4</span>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <span class="text-sm sm:text-xl">SISTEMA PORTUÁRIO ATIVO</span>
      </div>
    </div>

    <!-- GAME CANVAS CONTAINER -->
    <div class="relative w-full aspect-[16/9] bg-sky-900 rounded overflow-hidden border border-slate-700 shadow-inner flex items-center justify-center">
      
      <!-- Canvas -->
      <canvas id="gameCanvas" width="800" height="450" class="w-full h-full object-contain block"></canvas>

      <!-- Document Modal / Panel Limpo & Compacto -->
      <div id="docPanel" class="hidden absolute top-2 sm:top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm bg-amber-50 border-2 sm:border-4 border-amber-900 text-slate-900 p-3 sm:p-4 rounded-lg shadow-2xl z-20">
        <div class="border-b-2 border-amber-800/30 pb-2 mb-3 flex justify-between items-center">
          <h2 class="pixel-font text-[10px] sm:text-xs text-amber-900 uppercase">MANIFESTO DE CARGA</h2>
          <span class="bg-amber-200 text-amber-900 text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded font-bold border border-amber-400">OFICIAL</span>
        </div>

        <div class="space-y-1.5 text-base sm:text-lg font-sans">
          <div class="flex justify-between border-b border-amber-900/10 pb-1">
            <span class="text-amber-950 font-semibold">NOME:</span>
            <span id="docName" class="font-bold text-blue-900"></span>
          </div>
          <div class="flex justify-between border-b border-amber-900/10 pb-1">
            <span class="text-amber-950 font-semibold">ROTA:</span>
            <span id="docRoute" class="text-slate-800"></span>
          </div>
          <div class="flex justify-between border-b border-amber-900/10 pb-1">
            <span class="text-amber-950 font-semibold">CARGA:</span>
            <span id="docCargo" class="font-medium text-slate-900"></span>
          </div>
          <div class="flex justify-between border-b border-amber-900/10 pb-1">
            <span class="text-amber-950 font-semibold">TOXICIDADE:</span>
            <span id="docToxicity" class="font-bold"></span>
          </div>
          <div class="flex justify-between pb-1">
            <span class="text-amber-950 font-semibold">CALADO:</span>
            <span id="docSize" class="font-bold text-amber-900"></span>
          </div>
        </div>

        <!-- Botões de Ação -->
        <div class="mt-4 flex gap-2 font-mono">
          <button id="acceptBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-2 rounded border-b-2 border-emerald-800 active:translate-y-0.5 text-xs sm:text-sm transition flex items-center justify-center gap-1">
            ✓ ACEITAR
          </button>
          <button id="rejectBtn" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-1.5 px-2 rounded border-b-2 border-rose-800 active:translate-y-0.5 text-xs sm:text-sm transition flex items-center justify-center gap-1">
            ✕ RECUSAR
          </button>
        </div>
      </div>

      <!-- Relatório de Fim de Dia -->
      <div id="reportModal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-sm z-30 flex flex-col justify-center items-center p-3 sm:p-6 text-center">
        <div class="bg-slate-800 border-2 sm:border-4 border-amber-500 p-3 sm:p-6 rounded-lg max-w-lg w-full max-h-[90vh] overflow-y-auto custom-scroll shadow-2xl">
          <h2 class="pixel-font text-yellow-400 text-sm sm:text-lg mb-1 sm:mb-2">RELATÓRIO DO DIA <span id="reportDay">1</span></h2>
          <p class="text-slate-300 text-xs sm:text-sm mb-2">Resumo das Decisões do Porto</p>

          <div class="grid grid-cols-3 gap-1.5 sm:gap-2 my-2 sm:my-4 text-center">
            <div class="bg-slate-700 p-1.5 sm:p-2 rounded border border-slate-600">
              <div class="text-[10px] sm:text-xs text-slate-400">AVALIADOS</div>
              <div id="repTotal" class="text-lg sm:text-2xl font-bold text-white">0</div>
            </div>
            <div class="bg-slate-700 p-1.5 sm:p-2 rounded border border-slate-600">
              <div class="text-[10px] sm:text-xs text-emerald-400">ACEITOS</div>
              <div id="repAccepted" class="text-lg sm:text-2xl font-bold text-emerald-400">0</div>
            </div>
            <div class="bg-slate-700 p-1.5 sm:p-2 rounded border border-slate-600">
              <div class="text-[10px] sm:text-xs text-rose-400">RECUSADOS</div>
              <div id="repRejected" class="text-lg sm:text-2xl font-bold text-rose-400">0</div>
            </div>
          </div>

          <div id="reportImpact" class="p-2 sm:p-3 my-2 rounded text-left text-xs sm:text-sm font-sans bg-slate-900 border border-slate-700 space-y-1"></div>

          <div class="mt-3 sm:mt-4">
            <button id="nextDayBtn" class="pixel-font bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 sm:px-6 py-2 sm:py-3 rounded border-b-2 sm:border-b-4 border-amber-700 text-xs sm:text-sm active:translate-y-1 transition">
              CONTINUAR
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Dica -->
    <div class="bg-slate-800 p-1.5 sm:p-2 rounded text-slate-300 text-xs sm:text-sm flex justify-between items-center px-2 sm:px-4">
      <span>💡 Avalie as condições da embarcação e valide as informações antes de autorizar.</span>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    ctx.imageSmoothingEnabled = false;

    // UI Elements
    const docPanel = document.getElementById('docPanel');
    const acceptBtn = document.getElementById('acceptBtn');
    const rejectBtn = document.getElementById('rejectBtn');
    const reportModal = document.getElementById('reportModal');
    const nextDayBtn = document.getElementById('nextDayBtn');

    // Assets
    const images = { cenario: new Image(), mar: new Image(), marfrente: new Image(), boia: new Image(), personagem: new Image() };
    let assetsLoaded = false;

    function loadAssets(callback) {
      const sources = { 
        cenario: 'assets/cenario.png', 
        mar: 'assets/mar.png', 
        marfrente: 'assets/marfrente.png', 
        boia: 'assets/boia.png',
        personagem: 'assets/personagem.png'
      };
      let loaded = 0, total = Object.keys(sources).length;
      for (let k in sources) {
        images[k] = new Image();
        images[k].src = sources[k];
        images[k].onload = images[k].onerror = () => { if (++loaded === total) { assetsLoaded = true; callback(); } };
      }
    }

    // Configuração resumida dos navios
    const SHIP_TYPES = [
      {
        name: "MV Esperança",
        route: "Roterdã ➔ Local",
        cargo: "Insumos Hospitalares",
        toxicity: "0/5 (Nulo)",
        isHazard: false,
        size: "Pequeno (3m)",
        isLarge: false
      },
      {
        name: "Grão de Ouro",
        route: "Santos ➔ Local",
        cargo: "Grãos e Mantimentos",
        toxicity: "0/5 (Nulo)",
        isHazard: false,
        size: "Grande (12m)",
        isLarge: true
      },
      {
        name: "Gigante dos Mares",
        route: "Vitória ➔ Local",
        cargo: "Maquinário Pesado",
        toxicity: "1/5 (Baixo)",
        isHazard: false,
        size: "Médio (7m)",
        isLarge: false
      },
      {
        name: "Tritão das Marés",
        route: "Salvador ➔ Recife",
        cargo: "Água de Lastro / Bio-Risco",
        toxicity: "3/5 (Bio-Risco)",
        isHazard: true,
        size: "Médio (6m)",
        isLarge: false
      },
      {
        name: "Mar Furtivo",
        route: "Roterdã ➔ Local",
        cargo: "Pescado Irregular",
        toxicity: "2/5 (Impacto na Fauna)",
        isHazard: true,
        size: "Pequeno (4m)",
        isLarge: false
      },
      {
        name: "Risco Químico",
        route: "Internacional ➔ Local",
        cargo: "Resíduos Industriais",
        toxicity: "5/5 (Crítico)",
        isHazard: true,
        size: "Grande (11m)",
        isLarge: true
      }
    ];

    // Variáveis de Estado
    let currentDay = 1;
    let shipsEvaluated = 0;
    const maxShipsPerDay = 4;
    let isHighTide = false;
    let gameState = 'APPROACHING';

    let dayStats = { total: 0, accepted: 0, rejected: 0, hazardsAccepted: 0, groundedShips: 0 };

    let currentShip = {
      x: -140, y: 335, width: 120, height: 70, speed: 2, flipped: false, data: null
    };

    function generateRandomShip() {
      const template = SHIP_TYPES[Math.floor(Math.random() * SHIP_TYPES.length)];
      isHighTide = Math.random() < 0.5;

      return { ...template };
    }

    function drawScenario() {
      if (images.cenario.complete && images.cenario.naturalWidth > 0) {
        ctx.drawImage(images.cenario, 0, 0, 800, 450);
      } else {
        ctx.fillStyle = "#1e3a8a"; ctx.fillRect(0, 0, 800, 250);
        ctx.fillStyle = "#78350f"; ctx.fillRect(0, 250, 800, 200);
      }

      if (images.personagem.complete && images.personagem.naturalWidth > 0) {
        ctx.drawImage(images.personagem, 485, 80, 215, 125);
      }
    }

    function drawSeaAndBuoy() {
      const targetSeaY = isHighTide ? 315 : 370;
      if (!canvas.seaY) canvas.seaY = targetSeaY;
      canvas.seaY += (targetSeaY - canvas.seaY) * 0.05;
      const seaY = canvas.seaY;

      if (images.mar.complete && images.mar.naturalWidth > 0) {
        ctx.drawImage(images.mar, 0, seaY, 800, 450 - seaY);
      } else {
        ctx.fillStyle = "rgba(14, 116, 144, 0.75)";
        ctx.fillRect(0, seaY, 800, 450 - seaY);
      }

      drawShip();

      if (images.marfrente.complete && images.marfrente.naturalWidth > 0) {
        ctx.drawImage(images.marfrente, 0, seaY - 15, 800, 60);
      }

      if (images.boia.complete && images.boia.naturalWidth > 0) {
        const buoyY = seaY - 45 + Math.sin(Date.now() / 400) * 3;
        let srcX = 0;
        let srcY = 0;

        if (!isHighTide) {
          const isLuzAcesa = (Math.floor(Date.now() / 250) % 2) === 0;
          srcX = 0;
          srcY = isLuzAcesa ? 64 : 0; 
        }

        ctx.drawImage(images.boia, srcX, srcY, 64, 64, 680, buoyY, 48, 48);
      }
    }

    function drawShip() {
      if (!currentShip.data) return;
      ctx.save();
      currentShip.y = (canvas.seaY || 370) - 35;

      if (currentShip.flipped) {
        ctx.translate(currentShip.x + currentShip.width, currentShip.y);
        ctx.scale(-1, 1);
        ctx.translate(-currentShip.x, -currentShip.y);
      }

      const x = currentShip.x;
      const y = currentShip.y;

      ctx.fillStyle = currentShip.data.isHazard ? "#991b1b" : "#1d4ed8";
      ctx.fillRect(x, y + 20, currentShip.width, 35);

      ctx.beginPath();
      ctx.moveTo(x + currentShip.width, y + 20);
      ctx.lineTo(x + currentShip.width + 20, y + 20);
      ctx.lineTo(x + currentShip.width, y + 55);
      ctx.fillStyle = currentShip.data.isHazard ? "#7f1d1d" : "#1e40af";
      ctx.fill();

      ctx.fillStyle = "#f8fafc"; ctx.fillRect(x + 15, y, 35, 20);
      ctx.fillStyle = "#0284c7"; ctx.fillRect(x + 35, y + 4, 10, 8);
      ctx.fillStyle = "#dc2626"; ctx.fillRect(x + 20, y - 8, 8, 8);

      ctx.restore();
    }

    function updateGame() {
      document.getElementById('currentDay').innerText = currentDay;
      document.getElementById('shipCount').innerText = Math.min(shipsEvaluated + 1, maxShipsPerDay);

      if (gameState === 'APPROACHING') {
        currentShip.x += currentShip.speed;

        if (currentShip.x >= 380) {
          currentShip.x = 380;

          if (currentShip.data.isLarge && !isHighTide) {
            gameState = 'GROUNDED';
            handleGroundedShip();
          } else {
            gameState = 'INSPECTING';
            openInspectionPanel();
          }
        }
      } else if (gameState === 'LEAVING_ACCEPT') {
        currentShip.x += currentShip.speed * 1.5;
        if (currentShip.x > 850) nextShip();
      } else if (gameState === 'LEAVING_REJECT') {
        currentShip.x -= currentShip.speed * 1.5;
        if (currentShip.x < -150) nextShip();
      }
    }

    function handleGroundedShip() {
      dayStats.groundedShips++;
      dayStats.total++;
      setTimeout(() => {
        alert(`🚨 ACIDENTE PORTUÁRIO: O navio "${currentShip.data.name}" ENCALHOU pois a maré estava BAIXA!`);
        gameState = 'LEAVING_REJECT';
        currentShip.flipped = true;
      }, 300);
    }

    function openInspectionPanel() {
      const data = currentShip.data;
      document.getElementById('docName').innerText = data.name;
      document.getElementById('docRoute').innerText = data.route;
      document.getElementById('docCargo').innerText = data.cargo;
      
      const toxEl = document.getElementById('docToxicity');
      toxEl.innerText = data.toxicity;
      toxEl.className = data.isHazard ? "font-bold text-rose-600" : "font-bold text-emerald-600";

      document.getElementById('docSize').innerText = data.size;

      docPanel.classList.remove('hidden');
    }

    acceptBtn.addEventListener('click', () => {
      docPanel.classList.add('hidden');
      dayStats.total++;
      dayStats.accepted++;
      if (currentShip.data.isHazard) dayStats.hazardsAccepted++;
      gameState = 'LEAVING_ACCEPT';
    });

    rejectBtn.addEventListener('click', () => {
      docPanel.classList.add('hidden');
      dayStats.total++;
      dayStats.rejected++;
      currentShip.flipped = true;
      gameState = 'LEAVING_REJECT';
    });

    function spawnShip() {
      if (shipsEvaluated < maxShipsPerDay) {
        currentShip.x = -130;
        currentShip.flipped = false;
        currentShip.data = generateRandomShip();
        gameState = 'APPROACHING';
      } else {
        triggerEndOfDay();
      }
    }

    function nextShip() {
      shipsEvaluated++;
      spawnShip();
    }

    function triggerEndOfDay() {
      gameState = 'DAY_END';
      document.getElementById('reportDay').innerText = currentDay;
      document.getElementById('repTotal').innerText = dayStats.total;
      document.getElementById('repAccepted').innerText = dayStats.accepted;
      document.getElementById('repRejected').innerText = dayStats.rejected;

      const impactBox = document.getElementById('reportImpact');
      impactBox.innerHTML = "";

      if (dayStats.hazardsAccepted > 0) {
        impactBox.innerHTML += `<p class="text-rose-400">⚠️ ALERTA AMBIENTAL: ${dayStats.hazardsAccepted} embarcação(ões) nociva(s) foram autorizada(s)!</p>`;
      } else {
        impactBox.innerHTML += `<p class="text-emerald-400">🌱 EXCELENTE: O ecossistema marinho permaneceu seguro hoje.</p>`;
      }

      if (dayStats.groundedShips > 0) {
        impactBox.innerHTML += `<p class="text-amber-400">⚓ INCIDENTES: ${dayStats.groundedShips} navio(s) encalharam no canal.</p>`;
      }

      reportModal.classList.remove('hidden');
    }

    nextDayBtn.addEventListener('click', () => {
      reportModal.classList.add('hidden');
      if (currentDay < 3) {
        currentDay++;
      } else {
        alert("🎉 Turno de 3 dias encerrado com sucesso!");
        currentDay = 1;
      }
      shipsEvaluated = 0;
      dayStats = { total: 0, accepted: 0, rejected: 0, hazardsAccepted: 0, groundedShips: 0 };
      spawnShip();
    });

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawScenario();
      drawSeaAndBuoy();
      updateGame();
      requestAnimationFrame(gameLoop);
    }

    window.onload = () => {
      loadAssets(() => {
        spawnShip();
        gameLoop();
      });
    };
  </script>
</body>
</html>
