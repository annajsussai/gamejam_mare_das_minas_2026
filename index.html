<body class="flex items-center justify-center min-h-screen min-h-[100dvh] text-white p-1 sm:p-3 overflow-hidden">

  <div class="w-full max-w-5xl max-h-[100dvh] bg-slate-900 border-2 sm:border-4 border-amber-600 rounded-lg p-1.5 sm:p-3 shadow-2xl flex flex-col gap-1.5 sm:gap-3 my-auto">
    
    <!-- Top Bar Status -->
    <div class="flex justify-center items-center bg-slate-800 p-1.5 sm:p-3 rounded border border-slate-700 text-xs sm:text-base">
      <span class="pixel-font text-yellow-400 text-[10px] sm:text-sm">DIA <span id="currentDay">1</span> / 3</span>
    </div>

    <!-- GAME CANVAS CONTAINER -->
    <div class="relative w-full aspect-[16/9] bg-sky-900 rounded overflow-hidden border border-slate-700 shadow-inner flex items-center justify-center">
      
      <!-- Canvas do Jogo -->
      <canvas id="gameCanvas" width="800" height="450" class="w-full h-full object-contain block"></canvas>

      <!-- Document Modal / Panel -->
      <div id="docPanel" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[92%] sm:w-[78%] max-w-md aspect-[1/1.05] doc-bg text-[#3b281a] p-5 sm:p-7 z-20 flex flex-col justify-between rounded-sm">
        
        <!-- Cabeçalho Centralizado -->
        <div class="border-b-2 border-[#543d2b]/40 pb-2 text-center">
          <span class="pixel-font text-[8px] sm:text-[10px] text-[#543d2b] uppercase tracking-widest block">AUTORIDADE PORTUÁRIA</span>
          <h2 class="pixel-font text-[12px] sm:text-[15px] uppercase tracking-tight text-[#2b1b10] mt-1">MANIFESTO DE CARGA</h2>
        </div>

        <!-- Corpo do Documento -->
        <div class="my-auto space-y-2.5 font-mono">
          <div class="pixel-box p-2 sm:p-2.5 rounded-sm">
            <div class="flex justify-between items-baseline border-b border-[#543d2b]/15 pb-1 mb-1">
              <span class="text-[11px] sm:text-[13px] font-bold text-[#543d2b] uppercase">Embarcação:</span>
              <span id="docName" class="text-[15px] sm:text-[18px] font-bold text-[#2b1b10]"></span>
            </div>
            <div class="flex justify-between items-baseline">
              <span class="text-[11px] sm:text-[13px] font-bold text-[#543d2b] uppercase">Rota Registada:</span>
              <span id="docRoute" class="text-[14px] sm:text-[16px] font-bold text-[#2b1b10]"></span>
            </div>
          </div>

          <div class="pixel-box p-2 sm:p-2.5 rounded-sm flex flex-col">
            <span class="text-[10px] sm:text-[12px] font-bold text-[#543d2b] uppercase">Carga Declarada</span>
            <span id="docCargo" class="text-[14px] sm:text-[16px] font-bold text-[#2b1b10] mt-0.5 whitespace-normal leading-tight"></span>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div class="pixel-box p-2 sm:p-2.5 rounded-sm flex flex-col justify-between">
              <span class="text-[10px] sm:text-[12px] font-bold text-[#543d2b] uppercase">Porte</span>
              <span id="docSize" class="text-[13px] sm:text-[15px] font-bold text-[#2b1b10] mt-1"></span>
            </div>

            <div class="pixel-box p-2 sm:p-2.5 rounded-sm flex flex-col justify-between">
              <div class="flex justify-between items-center gap-1">
                <span class="text-[10px] sm:text-[12px] font-bold text-[#543d2b] uppercase">Toxicidade</span>
                <span id="docToxicityText" class="text-[12px] sm:text-[14px] font-bold"></span>
              </div>
              <div class="w-full h-2.5 bg-[#543d2b]/20 rounded-sm overflow-hidden flex p-0.5 border border-[#543d2b]/30 mt-1">
                <div id="toxicityBar" class="h-full rounded-xs transition-all duration-300" style="width: 20%;"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Botões de Ação -->
        <div class="flex gap-3 pt-2 border-t-2 border-[#543d2b]/30">
          <button id="acceptBtn" class="flex-1 bg-emerald-800 hover:bg-emerald-700 text-white font-bold py-2 px-2 rounded border-b-4 border-emerald-950 active:translate-y-0.5 pixel-font text-[9px] sm:text-[11px] transition flex items-center justify-center gap-1 shadow-md">
            AUTORIZAR
          </button>
          <button id="rejectBtn" class="flex-1 bg-rose-900 hover:bg-rose-800 text-white font-bold py-2 px-2 rounded border-b-4 border-rose-950 active:translate-y-0.5 pixel-font text-[9px] sm:text-[11px] transition flex items-center justify-center gap-1 shadow-md">
            RECUSAR
          </button>
        </div>

      </div>

      <!-- Relatório de Fim de Dia -->
      <div id="reportModal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-sm z-30 flex justify-center items-center p-2 sm:p-4">
        <div class="report-bg relative w-[96%] max-w-2xl aspect-[2/1] p-3 sm:p-6 shadow-2xl">

          <!-- Coluna de conteúdo (reserva espaço à direita/baixo p/ a lupa do fundo) -->
          <div class="w-full h-full flex flex-col justify-between pr-12 sm:pr-20 pb-2 sm:pb-4">

            <!-- Cabeçalho -->
            <div class="text-center">
              <h2 class="pixel-font text-slate-800 text-[10px] sm:text-base uppercase tracking-wider">Relatório de Inspeção</h2>
              <div class="flex items-center justify-center gap-2 mt-1 sm:mt-2">
                <span class="pixel-font text-slate-500 text-[7px] sm:text-[10px] uppercase">DIA <span id="reportDay">1</span></span>
                <span id="starRating" class="text-amber-500 text-xs sm:text-lg tracking-widest leading-none">★★★</span>
              </div>
            </div>

            <!-- Métricas Principais -->
            <div class="grid grid-cols-4 gap-1 sm:gap-2 my-1 sm:my-2">
              <div class="bg-slate-50 border border-slate-300 rounded p-1 sm:p-2 text-center">
                <div class="pixel-font text-[5px] sm:text-[7px] text-slate-500 uppercase mb-0.5 sm:mb-1 leading-tight">Avaliados</div>
                <div id="repTotal" class="pixel-font text-[11px] sm:text-xl text-slate-800">0</div>
              </div>
              <div class="bg-emerald-50 border border-emerald-400 rounded p-1 sm:p-2 text-center">
                <div class="pixel-font text-[5px] sm:text-[7px] text-emerald-700 uppercase mb-0.5 sm:mb-1 leading-tight">Aprov. Certa</div>
                <div id="repCorrectAccept" class="pixel-font text-[11px] sm:text-xl text-emerald-700">0</div>
              </div>
              <div class="bg-amber-50 border border-amber-400 rounded p-1 sm:p-2 text-center">
                <div class="pixel-font text-[5px] sm:text-[7px] text-amber-700 uppercase mb-0.5 sm:mb-1 leading-tight">Recusa Certa</div>
                <div id="repCorrectReject" class="pixel-font text-[11px] sm:text-xl text-amber-700">0</div>
              </div>
              <div class="bg-rose-50 border border-rose-400 rounded p-1 sm:p-2 text-center">
                <div class="pixel-font text-[5px] sm:text-[7px] text-rose-700 uppercase mb-0.5 sm:mb-1 leading-tight">Erros</div>
                <div id="repErrors" class="pixel-font text-[11px] sm:text-xl text-rose-700">0</div>
              </div>
            </div>

            <!-- Parecer da Avaliação do Dia -->
            <div id="reportImpactBox" class="bg-slate-50 border-l-4 border-slate-400 rounded p-1.5 sm:p-2.5 text-left">
              <div id="reportImpact" class="text-[10px] sm:text-sm leading-snug text-slate-700"></div>
            </div>

            <!-- Botão Continuar -->
            <div class="flex justify-center mt-1 sm:mt-2">
              <button id="nextDayBtn" class="pixel-font bg-slate-800 hover:bg-slate-700 text-white font-bold px-4 sm:px-8 py-1.5 sm:py-2 rounded border-b-4 border-amber-600 active:translate-y-0.5 active:border-b-0 transition text-[7px] sm:text-[10px] shadow-md">
                CONTINUAR &rarr;
              </button>
            </div>

          </div>

        </div>
      </div>

    </div>

    <!-- Dica rodapé -->
    <div class="bg-slate-800 p-1.5 sm:p-2 rounded text-slate-300 text-xs sm:text-sm flex justify-between items-center gap-2 px-2 sm:px-4">
      <span>DICA: Navios tóxicos ou grandes durante maré baixa DEVEM ser recusados!</span>
      <span class="pixel-font text-cyan-300 text-[8px] sm:text-[10px] whitespace-nowrap">NAVIO <span id="shipCount">1</span>/4</span>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    ctx.imageSmoothingEnabled = false;

    // Elementos da Interface
    const docPanel = document.getElementById('docPanel');
    const acceptBtn = document.getElementById('acceptBtn');
    const rejectBtn = document.getElementById('rejectBtn');
    const reportModal = document.getElementById('reportModal');
    const nextDayBtn = document.getElementById('nextDayBtn');

    // Imagens do jogo
    const images = { 
      cenario: new Image(), 
      mar: new Image(), 
      marfrente: new Image(), 
      boia: new Image(), 
      personagem: new Image(),
      navioPadrao: new Image()
    };

    function loadAssets(callback) {
      const sources = { 
        cenario: 'assets/cenario.png', 
        mar: 'assets/mar.png', 
        marfrente: 'assets/marfrente.png', 
        boia: 'assets/boia.png',
        personagem: 'assets/personagem.png',
        navioPadrao: 'assets/navio_padrao.png'
      };
      let loaded = 0, total = Object.keys(sources).length;
      for (let k in sources) {
        images[k] = new Image();
        images[k].src = sources[k];
        images[k].onload = images[k].onerror = () => { if (++loaded === total) callback(); };
      }
    }

      },
      {
        name: "Risco Químico",
        route: "Internacional ➔ Local",
        cargo: "Resíduos Industriais",
        toxicityVal: 5,
        toxicityText: "Crítico",
        isHazard: true,
        size: "Grande (11m)",
        isLarge: true
      }
    ];

    // Variáveis de Estado
    let currentDay = 1;
    let shipsEvaluated = 0;
    const maxShipsPerDay = 4;
    let isHighTide = false;
    let gameState = 'APPROACHING';

    // Estatísticas Detalhadas
    let dayStats = {
      total: 0,
      correctAccepts: 0, // Navio bom aceito
      correctRejects: 0, // Navio ruim (tóxico ou grande em maré baixa) recusado
      falseRejects: 0,   // Navio bom recusado sem necessidade
      falseAccepts: 0,   // Navio ruim autorizado erroneamente
      groundedShips: 0
    };

    let currentShip = {
      x: -160, y: 335, width: 140, height: 75, speed: 2, flipped: false, data: null
    };

    function generateRandomShip() {
      isHighTide = Math.random() < 0.5;

      if (shipsEvaluated === 0 && currentDay === 1) {
        return { ...SHIP_TYPES[0] };
      }
      const template = SHIP_TYPES[Math.floor(Math.random() * SHIP_TYPES.length)];
      return { ...template };
    }

    function drawScenario() {
      if (images.cenario.complete && images.cenario.naturalWidth > 0) {
        ctx.drawImage(images.cenario, 0, 0, 800, 450);
      } else {
        ctx.fillStyle = "#1e3a8a"; ctx.fillRect(0, 0, 800, 250);
        ctx.fillStyle = "#78350f"; ctx.fillRect(0, 250, 800, 200);
      }

      if (images.personagem.complete && images.personagem.naturalWidth > 0) {
        ctx.drawImage(images.personagem, 485, 80, 215, 125);
      }
    }

    function drawSeaAndBuoy() {
      const targetSeaY = isHighTide ? 315 : 370;
      if (!canvas.seaY) canvas.seaY = targetSeaY;
      canvas.seaY += (targetSeaY - canvas.seaY) * 0.05;
      const seaY = canvas.seaY;

      if (images.mar.complete && images.mar.naturalWidth > 0) {
        ctx.drawImage(images.mar, 0, seaY, 800, 450 - seaY);
      } else {
        ctx.fillStyle = "rgba(14, 116, 144, 0.75)";
        ctx.fillRect(0, seaY, 800, 450 - seaY);
      }

      drawShip();

      if (images.marfrente.complete && images.marfrente.naturalWidth > 0) {
        ctx.drawImage(images.marfrente, 0, seaY - 15, 800, 60);
      }

      if (images.boia.complete && images.boia.naturalWidth > 0) {
        const buoyY = seaY - 45 + Math.sin(Date.now() / 400) * 3;
        let srcX = 0;
        let srcY = 0;

        if (!isHighTide) {
          const isLuzAcesa = (Math.floor(Date.now() / 250) % 2) === 0;
          srcX = 0;
          srcY = isLuzAcesa ? 64 : 0; 
        }

        ctx.drawImage(images.boia, srcX, srcY, 64, 64, 680, buoyY, 48, 48);
      }
    }

    function drawShip() {
      if (!currentShip.data) return;
      ctx.save();
      currentShip.y = (canvas.seaY || 370) - 45;

      const x = currentShip.x;
      const y = currentShip.y;
      const w = currentShip.width;
      const h = currentShip.height;

      if (currentShip.flipped) {
        ctx.translate(x + w, y);
        ctx.scale(-1, 1);
        ctx.translate(-x, -y);
      }

      if (images.navioPadrao.complete && images.navioPadrao.naturalWidth > 0) {
        ctx.drawImage(images.navioPadrao, x, y, w, h);
      } else {
        ctx.fillStyle = currentShip.data.isHazard ? "#991b1b" : "#1d4ed8";
        ctx.fillRect(x, y + 20, w, 35);
      }

      ctx.restore();
    }

    function updateGame() {
      document.getElementById('currentDay').innerText = currentDay;
      document.getElementById('shipCount').innerText = Math.min(shipsEvaluated + 1, maxShipsPerDay);

      if (gameState === 'APPROACHING') {
        currentShip.x += currentShip.speed;

        if (currentShip.x >= 380) {
          currentShip.x = 380;
          gameState = 'INSPECTING';
          openInspectionPanel();
        }
      } else if (gameState === 'LEAVING_ACCEPT') {
        currentShip.x += currentShip.speed * 1.5;
        if (currentShip.x > 850) nextShip();
      } else if (gameState === 'LEAVING_REJECT') {
        currentShip.x -= currentShip.speed * 1.5;
        if (currentShip.x < -150) nextShip();
      }
    }

    function handleGroundedShip() {
      dayStats.groundedShips++;
      dayStats.falseAccepts++;
      dayStats.total++;
      setTimeout(() => {
        gameState = 'LEAVING_REJECT';
        currentShip.flipped = true;
      }, 300);
    }

    function openInspectionPanel() {
      const data = currentShip.data;
      document.getElementById('docName').innerText = data.name;
      document.getElementById('docRoute').innerText = data.route;
      document.getElementById('docCargo').innerText = data.cargo;
      document.getElementById('docSize').innerText = data.size;

      const toxText = document.getElementById('docToxicityText');
      const toxBar = document.getElementById('toxicityBar');
      
      toxText.innerText = data.toxicityText;

      const percentage = Math.max((data.toxicityVal / 5) * 100, 8);
      toxBar.style.width = `${percentage}%`;

      if (data.toxicityVal === 0) {
        toxText.className = "text-[11px] sm:text-[13px] font-bold text-emerald-800";
        toxBar.className = "h-full rounded-full transition-all duration-300 bg-emerald-600";
      } else if (data.toxicityVal <= 2) {
        toxText.className = "text-[11px] sm:text-[13px] font-bold text-amber-800";
        toxBar.className = "h-full rounded-full transition-all duration-300 bg-amber-500";
      } else {
        toxText.className = "text-[11px] sm:text-[13px] font-bold text-rose-900";
        toxBar.className = "h-full rounded-full transition-all duration-300 bg-rose-600";
      }

      docPanel.classList.remove('hidden');
    }

    // AÇÃO: AUTORIZAR
    acceptBtn.addEventListener('click', () => {
      docPanel.classList.add('hidden');
      const isBadShip = currentShip.data.isHazard || (currentShip.data.isLarge && !isHighTide);

      if (currentShip.data.isLarge && !isHighTide) {
        gameState = 'GROUNDED';
        handleGroundedShip();
      } else {
        dayStats.total++;
        if (isBadShip) {
          dayStats.falseAccepts++;
        } else {
          dayStats.correctAccepts++;
        }
        gameState = 'LEAVING_ACCEPT';
      }
    });

    // AÇÃO: RECUSAR
    rejectBtn.addEventListener('click', () => {
      docPanel.classList.add('hidden');
      dayStats.total++;
      
      // Avalia se o navio realmente devia ser recusado
      const isBadShip = currentShip.data.isHazard || (currentShip.data.isLarge && !isHighTide);

      if (isBadShip) {
        dayStats.correctRejects++; // Acertou ao recusar!
      } else {
        dayStats.falseRejects++;   // Errou: recusou um navio seguro!
      }

      currentShip.flipped = true;
      gameState = 'LEAVING_REJECT';
    });

    function spawnShip() {
      if (shipsEvaluated < maxShipsPerDay) {
        currentShip.x = -160;
        currentShip.flipped = false;
        currentShip.data = generateRandomShip();
        gameState = 'APPROACHING';
      } else {
        triggerEndOfDay();
      }
    }

    function nextShip() {
      shipsEvaluated++;
      spawnShip();
    }

    // AVALIAÇÃO DE DESEMPENHO DO DIA
    function triggerEndOfDay() {
      gameState = 'DAY_END';
      document.getElementById('reportDay').innerText = currentDay;
      document.getElementById('repTotal').innerText = dayStats.total;
      document.getElementById('repCorrectAccept').innerText = dayStats.correctAccepts;
      document.getElementById('repCorrectReject').innerText = dayStats.correctRejects;
      
      const totalErrors = dayStats.falseAccepts + dayStats.falseRejects;
      document.getElementById('repErrors').innerText = totalErrors;

      const impactBox = document.getElementById('reportImpact');
      const impactWrapper = document.getElementById('reportImpactBox');
      const starRating = document.getElementById('starRating');
      const borderClasses = ['border-emerald-500', 'border-amber-500', 'border-rose-500'];

      // Sistema de Estrelas e Diagnóstico
      if (totalErrors === 0) {
        starRating.innerText = "★★★";
        impactWrapper.classList.remove(...borderClasses);
        impactWrapper.classList.add('border-emerald-500');
        impactBox.innerHTML = `<span class="text-emerald-700 font-bold">EXCELENTE:</span> Inspeção perfeita! Autorizou navios seguros e bloqueou todos os riscos sem prejuízos.`;
      } else if (totalErrors === 1) {
        starRating.innerText = "★★☆";
        impactWrapper.classList.remove(...borderClasses);
        impactWrapper.classList.add('border-amber-500');
        if (dayStats.falseRejects > 0) {
          impactBox.innerHTML = `<span class="text-amber-700 font-bold">ATENÇÃO:</span> Bloqueou os perigos, mas recusou <span class="font-bold">${dayStats.falseRejects}</span> navio(s) regular(es) e seguro(s) sem motivo!`;
        } else {
          impactBox.innerHTML = `<span class="text-rose-700 font-bold">ALERTA:</span> Deixou passar <span class="font-bold">${dayStats.falseAccepts}</span> embarcação com irregularidades ou risco de encalhe!`;
        }
      } else {
        starRating.innerText = "★☆☆";
        impactWrapper.classList.remove(...borderClasses);
        impactWrapper.classList.add('border-rose-500');
        impactBox.innerHTML = `<span class="text-rose-800 font-bold">DESEMPENHO CRÍTICO:</span> Vários erros cometidos! (${dayStats.falseRejects} recusas indevidas e ${dayStats.falseAccepts} autorizações perigosas).`;
      }

      reportModal.classList.remove('hidden');
    }

    nextDayBtn.addEventListener('click', () => {
      reportModal.classList.add('hidden');
      currentDay++;
      shipsEvaluated = 0;
      dayStats = { total: 0, correctAccepts: 0, correctRejects: 0, falseRejects: 0, falseAccepts: 0, groundedShips: 0 };
      spawnShip();
    });

    // Loop principal
    function gameLoop() {
      ctx.clearRect(0, 0, 800, 450);
      drawScenario();
      drawSeaAndBuoy();
      updateGame();
      requestAnimationFrame(gameLoop);
    }

    loadAssets(() => {
      spawnShip();
      gameLoop();
    });
  </script>
</body>
</html>
