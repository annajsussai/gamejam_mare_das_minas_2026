<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador do Porto - Inspeção Dinâmica</title>
    <!-- Tailwind CSS para estilização moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <!-- Cabeçalho do Jogo -->
        <header class="flex justify-between items-center mb-4 pb-4 border-b border-slate-700">
            <div>
                <h1 class="text-2xl font-bold tracking-wide text-cyan-400">Gerenciador do Porto</h1>
                <p class="text-sm text-slate-400">Inspeção e Controle Portuário</p>
            </div>
            <div id="stats-panel" class="flex gap-4 text-sm font-semibold">
                <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                    Turno: <span id="turn-display" class="text-cyan-400">1</span>
                </div>
                <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                    Fundos: <span id="funds-display" class="text-emerald-400">R$ 5.000</span>
                </div>
            </div>
        </header>

        <!-- Área Principal / Canvas -->
        <div class="relative flex justify-center mb-6 bg-slate-950 rounded-lg overflow-hidden border border-slate-700 shadow-inner">
            <canvas id="gameCanvas" width="800" height="450" class="w-full max-w-[800px] h-auto"></canvas>
        </div>

        <!-- Painel de Diálogo / Ações -->
        <div class="bg-slate-900 rounded-lg p-4 border border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4">
            <div id="dialog-box" class="text-slate-300 text-sm md:text-base flex-1">
                Aguardando a chegada da próxima embarcação ao porto...
            </div>
            <div id="action-buttons" class="flex gap-2 w-full md:w-auto justify-end">
                <button onclick="handleInspect()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-4 py-2 rounded-lg transition-colors text-sm shadow">
                    Inspecionar Navio
                </button>
            </div>
        </div>
    </div>

    <!-- Script de Lógica do Jogo e Renderização -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Estado do Jogo
        let gameState = {
            turn: 1,
            funds: 5000,
            activeShip: null
        };

        // Carregamento de Imagens (Substitua pelos caminhos reais dos seus assets)
        const images = {
            cenario: new Image(),
            personagem: new Image(),
            navio: new Image()
        };

        images.cenario.src = 'cenario.png';
        images.personagem.src = 'personagem.png'; // Spritesheet (cada frame 120x84)
        images.navio.src = 'navio.png';

        // Dispara o loop básico assim que os assets carregarem ou por intervalo de segurança
        let assetsLoaded = 0;
        const totalAssets = 3;

        function assetLoadedCheck() {
            assetsLoaded++;
            if (assetsLoaded === totalAssets) {
                gameLoop();
            }
        }

        images.cenario.onload = assetLoadedCheck;
        images.personagem.onload = assetLoadedCheck;
        images.navio.onload = assetLoadedCheck;

        // Fallback caso as imagens demorem ou não existam localmente para testes rápidos
        setTimeout(() => {
            if (assetsLoaded < totalAssets) {
                gameLoop();
            }
        }, 1000);

        function drawScenario() {
            // Desenha o cenário de fundo ou um fallback azul/marrom caso a imagem falhe
            if (images.cenario.complete && images.cenario.naturalWidth > 0) {
                ctx.drawImage(images.cenario, 0, 0, 800, 450);
            } else {
                ctx.fillStyle = "#0f172a"; 
                ctx.fillRect(0, 0, 800, 250); // Céu/Água superior
                ctx.fillStyle = "#334155"; 
                ctx.fillRect(0, 250, 800, 200); // Docas/Plataforma
            }

            // Desenha o personagem ajustado para a janela do quiosque
            if (images.personagem.complete && images.personagem.naturalWidth > 0) {
                // Parâmetros: (image, sx, sy, sw, sh, dx, dy, dw, dh)
                // Recorta o frame 120x84 do spritesheet e posiciona na janela do quiosque
                ctx.drawImage(images.personagem, 0, 0, 120, 84, 520, 100, 140, 98);
            } else {
                // Placeholder para o personagem caso a imagem não carregue
                ctx.fillStyle = "#38bdf8";
                ctx.fillRect(520, 100, 140, 98);
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawScenario();
            requestAnimationFrame(gameLoop);
        }

        function handleInspect() {
            gameState.turn++;
            document.getElementById('turn-display').textContent = gameState.turn;
            document.getElementById('dialog-box').textContent = `Inspecionando os documentos da embarcação do turno ${gameState.turn}...`;
        }
    </script>
</body>
</html>
